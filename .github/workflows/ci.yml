name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    name: typecheck + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dimora-pwa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dimora-pwa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:ci

      - name: Production build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dimora-pwa/dist
          if-no-files-found: error
          retention-days: 5