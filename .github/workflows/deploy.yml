name: Deploy (Supabase + Vercel)

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supabase:
    name: Migrations + edge functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    defaults:
      run:
        working-directory: dimora-pwa
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply pending migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy edge functions
        run: |
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            if [ ! -f "$dir/index.ts" ]; then
              echo "skipping $name (no index.ts — shared module)"
              continue
            fi
            case "$name" in
              # Callbacks/webhooks authenticate via shared secret, HMAC, or internal
              # call — not an end-user JWT — so JWT verification must stay off.
              mpesa-callback|whatsapp-webhook|sms-notify)
                verify_jwt=--no-verify-jwt
                ;;
              *)
                verify_jwt=--verify-jwt
                ;;
            esac
            echo "deploying $name ($verify_jwt)"
            supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_REF" $verify_jwt
          done

      - name: Set edge-function secrets (empty ones are skipped)
        env:
          MPESA_CONSUMER_KEY: ${{ secrets.MPESA_CONSUMER_KEY }}
          MPESA_CONSUMER_SECRET: ${{ secrets.MPESA_CONSUMER_SECRET }}
          MPESA_PASSKEY: ${{ secrets.MPESA_PASSKEY }}
          MPESA_SHORTCODE: ${{ secrets.MPESA_SHORTCODE }}
          MPESA_ENVIRONMENT: ${{ secrets.MPESA_ENVIRONMENT }}
          MPESA_CALLBACK_SECRET: ${{ secrets.MPESA_CALLBACK_SECRET }}
          WHATSAPP_BUSINESS_API_TOKEN: ${{ secrets.WHATSAPP_BUSINESS_API_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${{ secrets.WHATSAPP_WEBHOOK_VERIFY_TOKEN }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          SMS_GATEWAY_VENDOR: ${{ secrets.SMS_GATEWAY_VENDOR }}
          SMS_GATEWAY_API_KEY: ${{ secrets.SMS_GATEWAY_API_KEY }}
          SMS_GATEWAY_USERNAME: ${{ secrets.SMS_GATEWAY_USERNAME }}
          SMS_GATEWAY_FROM: ${{ secrets.SMS_GATEWAY_FROM }}
          ML_FEATURE_FLAGS: ${{ secrets.ML_FEATURE_FLAGS }}
        run: |
          pairs=(
            "MPESA_CONSUMER_KEY=${MPESA_CONSUMER_KEY:-}"
            "MPESA_CONSUMER_SECRET=${MPESA_CONSUMER_SECRET:-}"
            "MPESA_PASSKEY=${MPESA_PASSKEY:-}"
            "MPESA_SHORTCODE=${MPESA_SHORTCODE:-}"
            "MPESA_ENVIRONMENT=${MPESA_ENVIRONMENT:-}"
            "MPESA_CALLBACK_SECRET=${MPESA_CALLBACK_SECRET:-}"
            "WHATSAPP_BUSINESS_API_TOKEN=${WHATSAPP_BUSINESS_API_TOKEN:-}"
            "WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}"
            "WHATSAPP_WEBHOOK_VERIFY_TOKEN=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}"
            "WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET:-}"
            "SMS_GATEWAY_VENDOR=${SMS_GATEWAY_VENDOR:-}"
            "SMS_GATEWAY_API_KEY=${SMS_GATEWAY_API_KEY:-}"
            "SMS_GATEWAY_USERNAME=${SMS_GATEWAY_USERNAME:-}"
            "SMS_GATEWAY_FROM=${SMS_GATEWAY_FROM:-}"
            "ML_FEATURE_FLAGS=${ML_FEATURE_FLAGS:-}"
          )
          for pair in "${pairs[@]}"; do
            key="${pair%%=*}"
            value="${pair#*=}"
            if [ -n "$value" ]; then
              supabase secrets set "$key=$value" --project-ref "$SUPABASE_PROJECT_REF"
            fi
          done

  vercel:
    name: Build + deploy to Vercel (production)
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    defaults:
      run:
        working-directory: dimora-pwa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dimora-pwa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Write Vercel project linkage
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}\n' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json

      - name: Pull project settings
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Build
        run: npx vercel build --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Deploy (prebuilt)
        run: npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"