name: Lighthouse budgets (perf regression guard)

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lighthouse:
    name: Lighthouse + budget assertions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dimora-pwa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dimora-pwa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Production build
        run: npm run build

      - name: Assert Lighthouse budgets
        run: npx @lhci/cli@0.14.0 autorun --config=lighthouserc.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: dimora-pwa/lighthouse-reports
          if-no-files-found: ignore
          retention-days: 14